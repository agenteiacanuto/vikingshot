<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VikingShot</title>
<meta name="description" content="Construa sua vila viking no fiorde e proteja suas terras.">
<meta name="theme-color" content="#1b2a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VikingShot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen isometric village canvas; floating HUD on top (resources) and bottom (mission, builders, battle); bottom sheet for building details. One deliberate dark look (fjord at dusk). */
:root{
  --night:#13202a; --wood:#2b1f16; --wood-hi:#4a3524; --edge:#120c07; --gold:#d9a441; --gold-hi:#f3d27a;
  --bone:#efe4cc; --bone-dim:#b6aa91; --ok:#7fc56b; --bad:#ff8a7a; --rune:#a98cff;
  --display:"Pirata One",Georgia,serif; --body:"Alegreya Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--night)}
body{background:var(--night);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* HUD */
.hud{position:fixed;left:0;right:0;z-index:5;pointer-events:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.hud > *{pointer-events:auto}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);display:grid;gap:6px}
.toprow{display:flex;align-items:center;gap:8px}
.jarl{display:flex;align-items:center;gap:8px;background:linear-gradient(var(--wood-hi),var(--wood));border:1px solid #5a4632;border-radius:14px;padding:4px 12px 4px 4px;box-shadow:0 3px 0 var(--edge)}
.jarl .lv{width:38px;height:38px;border-radius:10px;background:radial-gradient(circle at 35% 30%,#f5d37e,#a8761f);display:grid;place-items:center;color:#2a1a08;font:400 22px var(--display)}
.jarl b{display:block;font:400 18px/1 var(--display);color:var(--gold-hi)}
.jarl small{font-size:12px;color:var(--bone-dim);font-weight:700;font-variant-numeric:tabular-nums}
.jarl{position:relative;text-align:left;min-width:0;max-width:62vw}
.jarl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#cloudDot{position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--edge);background:#7a6a58}
#cloudDot[data-s=off]{display:none}
#cloudDot[data-s=ok]{background:var(--ok)}
#cloudDot[data-s=sync]{background:var(--gold-hi)}
#cloudDot[data-s=err]{background:var(--bad)}
.rank{margin-left:auto;width:40px;height:40px;display:grid;place-items:center;background:rgba(15,10,6,.78);border:1px solid #5a4632;border-radius:12px}
.rank + .runes{margin-left:0}
.inst{margin-left:auto;display:flex;align-items:center;gap:4px;border:2px solid #241708;border-radius:12px;background:linear-gradient(#f5d37e,#a8761f);color:#2a1a08;font:800 13px var(--body);padding:6px 9px;box-shadow:0 3px 0 #6b4a12}
.inst:not([hidden]) + .rank{margin-left:0}
.jarl{flex:1 1 auto;max-width:none}
.toprow > button:not(.jarl){flex:none}
@media (max-width:420px){.inst span{display:none}.inst{padding:6px 8px}.runes{padding:4px 8px 4px 5px}.r{padding:3px 5px 3px 3px}.r svg{width:18px;height:18px}.r span{font-size:13px}}
#tut{position:fixed;inset:0;z-index:9;pointer-events:none}
#tut .tbub{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 102px);max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:flex-start;background:linear-gradient(170deg,#4a3524,#2b1f16);border:2px solid var(--gold);border-radius:16px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:auto;animation:up .3s ease-out}
#tut .tav{width:44px;height:44px;flex:none;border-radius:12px;background:radial-gradient(circle at 35% 30%,#f5d37e,#a8761f);display:grid;place-items:center;color:#2a1a08;font:400 28px var(--display)}
#tut .tx{flex:1;min-width:0}#tut p{margin:0 0 6px;line-height:1.35;font-size:15px}
#tut .tbtns{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.tskip{border:0;background:none;color:var(--bone-dim);font:700 12px var(--body);text-decoration:underline}
#tutArrow{position:absolute;left:0;top:0;margin:-34px 0 0 -14px;font-size:30px;color:var(--gold-hi);text-shadow:0 2px 0 #4a2f08,0 0 10px rgba(0,0,0,.6);animation:tarr .8s ease-in-out infinite alternate}
@keyframes tarr{to{margin-top:-24px}}
.mission.dot::after{content:'';position:absolute;right:8px;top:8px;width:11px;height:11px;border-radius:50%;background:#e0523f;border:2px solid #2b1f16}
.mission{position:relative}
.mitem.dq{justify-content:space-between}.mitem.dq small{color:var(--bone-dim);font-weight:800}.mitem.dq svg{width:15px;height:15px;vertical-align:-3px}
.chestline{cursor:pointer;margin-top:6px}
.chestrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.cd{display:grid;gap:2px;justify-items:center;background:rgba(0,0,0,.28);border-radius:8px;padding:5px 2px;font-size:11px;font-weight:800}
.cd b{font:400 13px var(--display);color:var(--gold-hi)}.cd span{display:flex;align-items:center;gap:1px}.cd svg{width:13px;height:13px}
.cd.got{opacity:.45}.cd.now{outline:2px solid var(--gold);background:rgba(217,164,65,.18)}
.chest{position:relative;width:110px;height:90px;margin:10px auto}
.chest .box{position:absolute;left:0;right:0;bottom:0;height:55px;border-radius:6px;background:linear-gradient(#8a5a2c,#5c3a1a);border:3px solid #2b1a08;box-shadow:inset 0 0 0 4px #d9a441}
.chest .lid{position:absolute;left:-3px;right:-3px;top:8px;height:34px;border-radius:30px 30px 4px 4px;background:linear-gradient(#a8743f,#6b4527);border:3px solid #2b1a08;box-shadow:inset 0 0 0 4px #d9a441;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1);z-index:1}
.chest:not(.open) .lid{animation:wob 1.4s ease-in-out infinite}
.chest.open .lid{transform:rotate(-35deg) translateY(-14px)}
.chest.open::after{content:'';position:absolute;left:10px;right:10px;top:30px;height:30px;background:radial-gradient(#fff6c8,rgba(243,210,122,0));filter:blur(4px)}
@keyframes wob{50%{transform:rotate(3deg)}}
.sets{display:grid;gap:6px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(0,0,0,.28);border-radius:10px;padding:6px 10px;font-weight:700}
.tg{border:1px solid #5a4632;border-radius:999px;background:rgba(0,0,0,.3);color:var(--bone-dim);font:800 13px var(--body);padding:5px 12px}
.tg.on{background:linear-gradient(#9ad27f,#4d8a3a);color:#10200a;border-color:#1f3a14}
.seg{display:flex;gap:4px}.seg button{border:1px solid #5a4632;border-radius:8px;background:rgba(0,0,0,.3);color:var(--bone-dim);font:800 12px var(--body);padding:5px 9px}
.seg button.on{background:linear-gradient(#f5d37e,#a8761f);color:#2a1a08}
.side{top:auto;bottom:auto;left:auto;right:0;top:calc(env(safe-area-inset-top,0px) + 112px);display:grid;gap:5px;width:auto;padding-right:max(8px,env(safe-area-inset-right,0px))}
.sbtn{position:relative;width:54px;display:grid;justify-items:center;gap:1px;border:2px solid #241708;border-radius:14px;background:linear-gradient(var(--wood-hi),var(--wood));box-shadow:0 3px 0 var(--edge);padding:5px 2px 4px;color:var(--bone);font:800 11px var(--body)}
.sbtn svg{width:24px;height:24px}.sbtn small{font-size:9px;color:var(--gold-hi)}
.sbtn.dot::after,.mission.dot::after{content:'';position:absolute;right:4px;top:4px;width:11px;height:11px;border-radius:50%;background:#e0523f;border:2px solid #2b1f16}
body.battle .side,body.cine .side{display:none!important}
body.camp .btop .wavebox:nth-child(2){display:none}body.camp .btop{grid-template-columns:1fr}
.teamrow{display:flex;gap:8px;margin:8px 0}
.slot{width:64px;height:64px;border-radius:14px;border:2px dashed #5a4632;display:grid;place-items:center;color:var(--bone-dim);font:800 22px var(--body);background:rgba(0,0,0,.25);overflow:hidden;padding:0}
button.slot{border-style:solid;border-color:var(--gold)}.slot img{width:100%;height:100%;object-fit:cover}.slot.lock{opacity:.5;font-size:18px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.hcard{display:grid;justify-items:center;gap:1px;border:2px solid var(--rc);border-radius:14px;background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(0,0,0,.3));padding:6px 4px;color:var(--bone)}
.hcard.locked{filter:grayscale(.85) brightness(.75)}.hcard.team{box-shadow:0 0 0 2px var(--gold-hi) inset}.hcard.can{animation:glow 1.2s ease-in-out infinite}
.hcard b{font:400 17px var(--display);color:var(--gold-hi)}.hcard small{font-size:11px;color:var(--bone-dim);font-weight:800}
.pt{width:72px;height:72px;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.18),rgba(0,0,0,.35));display:grid;place-items:center}
.pt img{width:100%;height:100%;object-fit:cover}.pt.big{width:96px;height:96px;border:2px solid var(--rc);flex:none}.pfb{font:400 34px var(--display);color:var(--gold-hi)}
.st{color:#f3d27a;font-size:12px;letter-spacing:1px}.st i{color:#4a3a2a;font-style:normal}.st.big{font-size:20px}
.shb{position:relative;width:100%;height:13px;border-radius:7px;background:#120d09;overflow:hidden}.shb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#a8761f,#f3d27a)}
.shb span{position:relative;display:block;text-align:center;font:800 10px/13px var(--body);color:#fff}
.hhead{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.odds{display:flex;gap:10px;flex-wrap:wrap;font-weight:800;font-size:13px;margin:6px 0}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin:8px 0}
.rv{display:grid;justify-items:center;border:2px solid var(--rc);border-radius:12px;padding:6px;background:rgba(0,0,0,.3);animation:flip .5s ease-out both}
.rv b{font:400 16px var(--display);color:var(--gold-hi)}.rv span{font:800 16px var(--body);color:#fff}
@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:0}}
.techs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tech{display:grid;gap:2px;text-align:left;border:1px solid #5a4632;border-radius:12px;background:rgba(0,0,0,.28);padding:7px 9px;color:var(--bone)}
.tech b{font:400 16px var(--display);color:var(--gold-hi)}.tech small{font-size:12px;color:var(--bone-dim);font-weight:700}
.tech .lv{color:#b59cff;letter-spacing:2px}.tech .tc{font-size:12px;font-weight:800}.tech .tc svg{width:14px;height:14px;vertical-align:-3px}
.tech.locked{opacity:.55}.tech.max{outline:1px solid var(--ok)}.tech .req{margin:0;font-size:12px}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.node{display:grid;justify-items:center;gap:1px;border:2px solid #5a4632;border-radius:14px;background:rgba(0,0,0,.3);padding:8px 2px;color:var(--bone)}
.node b{font:400 18px var(--display)}.node i{font-style:normal;color:#f3d27a;font-size:13px;letter-spacing:1px}
.node.done{border-color:#7a6a3a}.node.cur{border-color:var(--gold-hi);box-shadow:0 0 0 2px var(--gold-hi) inset;animation:glow 1.2s ease-in-out infinite}
.node.boss{background:rgba(120,30,20,.35)}.node:disabled{opacity:.4}
.bigstars{text-align:center;font-size:44px;line-height:1;margin:4px 0}.bigstars b{color:#f3d27a;text-shadow:0 0 12px rgba(243,210,122,.7)}.bigstars i{color:#3a2c1c;font-style:normal}
.evhow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.evhow span{background:rgba(0,0,0,.28);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800}
.tiers{display:grid;gap:6px}.tier{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.28);border-radius:10px;padding:6px 10px;font-weight:800}
.tier b{width:56px;color:var(--gold-hi)}.tier span{flex:1;display:flex;gap:6px;flex-wrap:wrap}.tier svg{width:16px;height:16px;vertical-align:-3px}.tier.done{opacity:.5}.tier.ok{outline:1px solid var(--gold)}
.camb.spd{font:800 15px var(--body);color:var(--bone)}.camb.spd.on{color:var(--gold-hi)}
.gslots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.gslot{display:grid;justify-items:center;gap:1px;border:2px solid var(--rc);border-radius:12px;background:rgba(0,0,0,.3);padding:6px 3px;color:var(--bone);min-height:78px}
.gslot svg{width:30px;height:30px}.gslot b{font-size:12px}.gslot small{font-size:10px;color:var(--bone-dim);font-weight:800;text-align:center;line-height:1.15}.gslot span{font:800 24px var(--body);color:var(--bone-dim)}
.glist{display:grid;gap:6px}.gitem{display:flex;align-items:center;gap:8px;border:1px solid var(--rc);border-radius:12px;background:rgba(0,0,0,.28);padding:6px 8px}
.gitem.on{box-shadow:0 0 0 2px var(--gold) inset}.gitem svg{width:32px;height:32px;flex:none}.gi{flex:1;min-width:0}.gi b{display:block;font:400 16px var(--display);color:var(--gold-hi)}.gi small{font-size:12px;color:var(--bone-dim);font-weight:700}
.gb{display:flex;gap:4px}.gb .btn{min-width:0;padding:5px 9px;font-size:15px}
.patrol{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,rgba(217,164,65,.18),rgba(0,0,0,.25));border:1px solid var(--gold);border-radius:12px;padding:8px 10px;margin:8px 0}
.patrol > div{flex:1;min-width:0}.patrol b{font:400 19px var(--display);color:var(--gold-hi)}.patrol small{display:block;font-size:11px;color:var(--bone-dim);font-weight:700}.patrol span{display:flex;flex-wrap:wrap;gap:6px;font-weight:800;font-size:13px;margin-top:2px}.patrol svg{width:15px;height:15px;vertical-align:-3px}
.ptrack{display:grid;gap:5px;max-height:44vh;overflow-y:auto;margin:8px 0;padding-right:4px}
.pt2{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.28);border-radius:10px;padding:6px 10px;font-weight:800}.pt2 b{width:26px;font:400 20px var(--display);color:var(--gold-hi)}.pt2 span{flex:1;display:flex;gap:6px;flex-wrap:wrap}.pt2 svg{width:16px;height:16px;vertical-align:-3px}
.pt2.done{opacity:.45}.pt2.ok{outline:1px solid var(--gold)}.pt2.big{background:rgba(192,140,255,.15)}
.pgold{display:grid;gap:2px;border:1px dashed var(--gold);border-radius:12px;padding:8px 10px;opacity:.75}.pgold b{color:var(--gold-hi)}.pgold span{font-size:13px}
.opps{display:grid;gap:6px;margin:6px 0}.opp{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border-radius:12px;padding:8px 10px}.opp > div{flex:1;min-width:0}
.opp b{font:400 18px var(--display);color:var(--gold-hi)}.opp small{display:block;font-size:12px;color:var(--bone-dim);font-weight:700}.opp .oh{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:800}.opp .oh i{font-style:normal}
.steps{margin:6px 0 10px;padding-left:22px;line-height:1.5}.steps li{margin:4px 0}
.runes.gems{border-color:#6b5a1e;padding-right:10px}
/* Cenas */
body.cine .hud,body.cine #tags,body.cine .bhud{display:none!important}
#cine{position:fixed;inset:0;z-index:15;pointer-events:none}
#cine .lb{position:absolute;left:0;right:0;height:11vh;background:#000;animation:lbin .5s ease-out both}
#cine .lb.t{top:0}#cine .lb.b{bottom:0}
@keyframes lbin{from{transform:scaleY(0)}}
#cine .lb.t{transform-origin:top}#cine .lb.b{transform-origin:bottom}
#cineCap{position:absolute;left:0;right:0;bottom:calc(11vh + 14px);text-align:center;font:400 clamp(24px,6vw,40px)/1.1 var(--display);color:var(--gold-hi);text-shadow:0 3px 0 #2a1a08,0 0 18px rgba(0,0,0,.7);opacity:0;transform:translateY(10px);transition:.5s;padding:0 16px}
#cineCap.show{opacity:1;transform:none}
#cineSkip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(11vh + 12px);pointer-events:auto;border:1px solid #5a4632;border-radius:999px;background:rgba(15,10,6,.8);color:var(--bone);font:800 14px var(--body);padding:7px 14px}
.costs.big .cost{font-size:20px;padding:10px 12px}.costs.big svg{width:28px;height:28px}
.costs.inline{display:inline-flex;flex-wrap:wrap;gap:4px;margin:0;justify-content:flex-end}
.costs.inline .cost{padding:2px 6px;font-size:13px}.costs.inline svg{width:16px;height:16px}
.exp{background:rgba(0,0,0,.22);border:1px solid #4a3a2a;border-radius:14px;padding:10px 12px;margin:8px 0}
.exph{display:flex;align-items:baseline;justify-content:space-between}.exph b{font:400 22px var(--display);color:var(--gold-hi)}.exph small{color:var(--bone-dim);font-weight:800}
.exprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;font-weight:700}
.exprow small{color:var(--bone-dim);font-weight:700}.exprow svg{width:18px;height:18px;vertical-align:-3px}
.stepper{display:flex;align-items:center;gap:10px}.stepper b{min-width:22px;text-align:center;font-size:18px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid #5a4632;background:rgba(0,0,0,.3);font:800 20px var(--body);color:var(--bone)}
.stepper button:disabled{opacity:.4}
.durs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.durs button{border:1px solid #5a4632;border-radius:10px;background:rgba(0,0,0,.28);color:var(--bone-dim);font:800 14px var(--body);padding:7px 0}
.durs button.on{background:linear-gradient(#f5d37e,#a8761f);color:#2a1a08;border-color:#241708}
.ok{color:var(--ok);font-weight:800;margin:4px 0}
.crops{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:6px}
.crop{display:grid;gap:2px;text-align:left;border:1px solid #5a4632;border-radius:12px;background:rgba(0,0,0,.28);padding:8px 10px;color:var(--bone)}
.crop b{font:400 18px var(--display);color:var(--gold-hi)}.crop span{font-size:13px;font-weight:700}.crop svg{width:16px;height:16px;vertical-align:-3px}
.crop small{color:var(--bad);font-weight:800}.crop.locked{opacity:.55}
.fld-row{width:100%;border:0;color:var(--bone);text-align:left;font:700 15px var(--body)}
.relics{display:grid;gap:6px}
.relic{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.28);border-radius:12px;padding:8px 10px}
.relic > div{flex:1;min-width:0}.relic b{font:400 19px var(--display);color:var(--gold-hi)}.relic p{margin:2px 0;font-size:13px}
.relic .costs{margin:4px 0 0;grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}.relic .cost{padding:3px 6px;font-size:13px}.relic .cost svg{width:16px;height:16px}
.relic.own{outline:1px solid var(--ok)}
.market{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.market .btn{display:flex;align-items:center;justify-content:center;gap:4px;font:800 15px var(--body)}.market svg{width:18px;height:18px}
.fld{display:grid;gap:4px;margin-bottom:8px}
.fld span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim)}
.fld input,.mailrow input{font:700 17px var(--body);color:var(--bone);background:rgba(0,0,0,.35);border:1px solid #5a4632;border-radius:10px;padding:9px 12px;width:100%;-webkit-user-select:text;user-select:text}
