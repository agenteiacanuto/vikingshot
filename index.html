<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VikingShot</title>
<meta name="description" content="Construa sua vila viking no fiorde e proteja suas terras.">
<meta name="theme-color" content="#1b2a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VikingShot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen isometric village canvas; floating HUD on top (resources) and bottom (mission, builders, battle); bottom sheet for building details. One deliberate dark look (fjord at dusk). */
:root{
  --night:#13202a; --wood:#2b1f16; --wood-hi:#4a3524; --edge:#120c07; --gold:#d9a441; --gold-hi:#f3d27a;
  --bone:#efe4cc; --bone-dim:#b6aa91; --ok:#7fc56b; --bad:#ff8a7a; --rune:#a98cff;
  --display:"Pirata One",Georgia,serif; --body:"Alegreya Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--night)}
body{background:var(--night);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* HUD */
.hud{position:fixed;left:0;right:0;z-index:5;pointer-events:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.hud > *{pointer-events:auto}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);display:grid;gap:6px}
.toprow{display:flex;align-items:center;gap:8px}
.jarl{display:flex;align-items:center;gap:8px;background:linear-gradient(var(--wood-hi),var(--wood));border:1px solid #5a4632;border-radius:14px;padding:4px 12px 4px 4px;box-shadow:0 3px 0 var(--edge)}
.jarl .lv{width:38px;height:38px;border-radius:10px;background:radial-gradient(circle at 35% 30%,#f5d37e,#a8761f);display:grid;place-items:center;color:#2a1a08;font:400 22px var(--display)}
.jarl b{display:block;font:400 18px/1 var(--display);color:var(--gold-hi)}
.jarl small{font-size:12px;color:var(--bone-dim);font-weight:700;font-variant-numeric:tabular-nums}
.runes{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(15,10,6,.78);border:1px solid #4a3a5e;border-radius:999px;padding:4px 12px 4px 6px;font-weight:800;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.r{display:flex;align-items:center;gap:5px;background:rgba(15,10,6,.78);border:1px solid #3d3024;border-radius:12px;padding:3px 8px 3px 4px;min-width:0}
.r svg{width:22px;height:22px;flex:none}
.r span{font:800 14px var(--body);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.full span{color:var(--gold-hi)}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:grid;gap:8px}
.mission{display:flex;align-items:center;gap:10px;background:rgba(15,10,6,.85);border:1px solid #5a4632;border-radius:14px;padding:8px 10px;text-align:left;width:100%}
.mission .ic{width:30px;height:30px;flex:none;border-radius:8px;background:#3a2a1d;display:grid;place-items:center;font:400 20px var(--display);color:var(--gold-hi)}
.mission .tx{flex:1;min-width:0}
.mission .tx small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim);font-weight:800}
.mission .tx b{font-size:15px}
.mission.done{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.mission .claim{background:linear-gradient(#f5d37e,#a8761f);color:#2a1a08;border-radius:10px;padding:6px 10px;font:400 17px var(--display)}
.dock{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:stretch}
.builder{display:flex;align-items:center;gap:8px;background:rgba(15,10,6,.85);border:1px solid #3d3024;border-radius:12px;padding:6px 10px;min-width:0}
.builder svg{width:22px;height:22px;flex:none}
.builder span{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.builder.busy span{color:var(--gold-hi)}
.battle{border:1px solid #5a4632;border-radius:12px;background:linear-gradient(#5a2a22,#341410);padding:6px 10px;font:400 18px var(--display);color:#f3c9bd;opacity:.75}

/* Sheet */
.sheet-bg{position:fixed;inset:0;z-index:10;background:rgba(5,8,10,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;background:linear-gradient(170deg,#4a3524,#2b1f16 50%,#1e150e);
  border:2px solid var(--gold);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.6);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  max-height:82vh;overflow-y:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0;font:400 30px/1 var(--display);color:var(--gold-hi)}
.sheet .sub{margin:2px 0 10px;color:var(--bone-dim);font-size:14px}
.sheet .desc{margin:0 0 12px;line-height:1.4}
.stat{display:flex;justify-content:space-between;gap:10px;background:rgba(0,0,0,.28);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-weight:700}
.stat .up{color:var(--ok)}
.costs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:10px 0}
.cost{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);border-radius:10px;padding:6px 8px;font-weight:800;font-variant-numeric:tabular-nums}
.cost svg{width:20px;height:20px}
.cost.miss{color:var(--bad)}
.req{margin:6px 0;color:var(--bad);font-weight:700;font-size:14px}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;appearance:none;border:2px solid #241708;border-radius:12px;background:linear-gradient(#f5d37e,var(--gold) 55%,#a8761f);color:#2a1a08;
  font:400 22px var(--display);padding:9px 12px 10px;box-shadow:0 4px 0 #6b4a12}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4a12}
.btn.ghost{background:linear-gradient(var(--wood-hi),var(--wood));color:var(--bone);border-color:var(--edge);box-shadow:0 4px 0 var(--edge)}
.btn.rune{background:linear-gradient(#c9b5ff,#7a5ad8);color:#1c1238;box-shadow:0 4px 0 #3f2a80}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.mlist{display:grid;gap:6px;margin-top:6px}
.mitem{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.28);border-radius:10px;padding:8px 12px;font-weight:700}
.mitem.done{opacity:.55}
.mitem.cur{outline:2px solid var(--gold)}
.mitem small{margin-left:auto;color:var(--bone-dim);font-weight:700;white-space:nowrap}
.toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:20;background:rgba(15,10,6,.92);border:1px solid var(--gold);border-radius:999px;padding:8px 16px;
  font-weight:800;white-space:nowrap;pointer-events:none;opacity:0}
.toast.show{animation:toast 1.8s ease}
@keyframes toast{10%,75%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.toast.show{opacity:1}}

/* Etiquetas sobre o 3D */
#tags{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
.tag > *{transform:translate(-50%,-100%)}
.tag .lvl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);min-width:24px;height:24px;border-radius:12px;padding:0 6px;background:linear-gradient(#f5d37e,#a8761f);color:#2a1a08;font:400 15px/24px var(--display);text-align:center;border:1.5px solid #241708;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.tag .sign{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:rgba(20,14,9,.85);border:1px solid #5a4632;border-radius:8px;padding:3px 8px;font-weight:800;font-size:12px;color:var(--bone-dim);white-space:nowrap}
.tag .sign.free{color:#2a1a08;background:linear-gradient(#f5d37e,#a8761f);border-color:#241708;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 4px))}}
.tag .prog{position:absolute;left:0;top:0;transform:translate(-50%,-150%);width:78px;height:18px;border-radius:9px;background:rgba(15,10,6,.88);overflow:hidden;border:1px solid #5a4632}
.tag .prog i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#f3d27a,#d9a441)}
.tag .prog b{position:relative;display:block;text-align:center;font:800 11px/16px var(--body);color:#fff3dc;text-shadow:0 1px 2px #000}
.tag .bubble{position:absolute;left:0;top:0;transform:translate(-50%,-140%);pointer-events:auto;width:40px;height:40px;border-radius:50%;border:2px solid #6b4a12;background:#fff6e2;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.35);animation:bub 1.4s ease-in-out infinite}
.tag .bubble.full{background:#f3d27a}
.tag .bubble svg{width:26px;height:26px}
@keyframes bub{50%{transform:translate(-50%,calc(-140% - 5px))}}
.floaty{position:fixed;z-index:4;pointer-events:none;display:flex;align-items:center;gap:4px;transform:translate(-50%,-100%);font:800 15px var(--body);color:#fff3dc;text-shadow:0 2px 3px #000;animation:fl 1.4s ease-out forwards}
.floaty svg{width:20px;height:20px}
@keyframes fl{to{opacity:0;margin-top:-50px}}
/* Carregamento */
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2e4a3a,#13202a);transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
#loading .box{text-align:center;display:grid;gap:12px;justify-items:center}
#loading h1{margin:0;font:400 54px/1 var(--display);color:var(--gold-hi);text-shadow:0 3px 0 #4a2f08}
#loading .bar{width:220px;height:10px;border-radius:5px;background:#120d09;border:1px solid #5a4632;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a8761f,#f3d27a);transition:width .2s}
#loading p{margin:0;color:var(--bone-dim);font-weight:700}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/"}}</script>
</head>
<body>
<canvas id="world" aria-label="Vila viking em 3D"></canvas>
<div id="tags"></div>
<div class="hud top">
  <div class="toprow">
    <div class="jarl"><div class="lv" id="hallLv">1</div><div><b>Vila do Jarl</b><small id="power">Poder 0</small></div></div>
    <button class="runes" id="btnRunes" aria-label="Runas"><svg viewBox="0 0 24 24" width="22" height="22" data-ico="runes"></svg><span id="runes">0</span></button>
  </div>
  <div class="res" id="res"></div>
</div>

<div class="hud bottom">
  <button class="mission" id="mission"><span class="ic">ᛟ</span><span class="tx"><small>Missão</small><b id="missionText">…</b></span></button>
  <div class="dock">
    <div class="builder" id="b0"><svg viewBox="0 0 24 24" data-ico="hammer"></svg><span>Livre</span></div>
    <div class="builder" id="b1"><svg viewBox="0 0 24 24" data-ico="hammer"></svg><span>Livre</span></div>
    <button class="battle" id="btnBattle" aria-label="Batalha (em breve)">Batalha</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast"></div>

<div id="loading"><div class="box"><h1>VikingShot</h1><div class="bar"><i id="loadBar"></i></div><p id="loadMsg">Carregando a vila…</p></div></div>
<script>
if (location.protocol === 'file:') document.getElementById('loadMsg').innerHTML = 'Este jogo 3D precisa ser aberto por um endereço <b>http://</b> (GitHub Pages ou servidor local).<br>Abrir o arquivo com dois cliques não funciona.';
else setTimeout(() => { const m = document.getElementById('loadMsg'); if (m && document.getElementById('loading')) m.textContent = 'Ainda carregando… se não avançar, recarregue a página.'; }, 25000);
</script>
<script type="module" src="app.js"></script>
</body>
</html>
